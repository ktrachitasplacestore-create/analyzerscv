<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analyzers_CV by Automatia Studio</title>
  <!-- Tailwind CSS --><script src="https://cdn.tailwindcss.com"></script>
  <!-- React Libraries --><script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX transpilation --><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Custom font and minor style adjustments */
    body {
      font-family: 'Inter', sans-serif;
    }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    /* Custom scrollbar for aesthetic */
    ::-webkit-scrollbar {
        width: 8px;
    }
    ::-webkit-scrollbar-track {
        background: #1a0033; /* Dark purple for track */
    }
    ::-webkit-scrollbar-thumb {
        background: #6c4e97; /* Lighter purple for thumb */
        border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #8b6db4;
    }
    /* Simple fade-in animation */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-purple-950 to-black text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Main Application Component ---
    function App() {
      // The n8n webhook URL (kept internally, not exposed to user)
      const WEBHOOK_URL = "https://invalvn8n.inversionesalvarado.website/webhook-test/analyzerscv";

      const [jobFile, setJobFile] = useState(null);
      const [cvFile, setCvFile] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [resultHTML, setResultHTML] = useState(null); // Will store the HTML string from the analysis
      const [analysisHistory, setAnalysisHistory] = useState([]); // History of analyses
      const [mockMode, setMockMode] = useState(true); // Demo mode for quick UI testing

      // Load history from localStorage on component mount
      useEffect(() => {
        try {
          const storedHistory = localStorage.getItem("analysisHistory_v2");
          if (storedHistory) {
            setAnalysisHistory(JSON.parse(storedHistory));
          }
        } catch (e) {
          console.error("Failed to load analysis history from localStorage", e);
        }
      }, []);

      // Save history to localStorage whenever it changes
      useEffect(() => {
        try {
          localStorage.setItem("analysisHistory_v2", JSON.stringify(analysisHistory));
        } catch (e) {
          console.error("Failed to save analysis history to localStorage", e);
        }
      }, [analysisHistory]);

      // Example HTML string contract your n8n webhook should return
      const mockHTMLResponse = `
        <div class="space-y-6 text-white p-2">
            <div class="flex items-center justify-between p-4 bg-purple-800/70 rounded-xl shadow">
                <div>
                    <p class="text-sm text-purple-300">Rating Global</p>
                    <p class="text-4xl font-bold text-beige-100">8 / 10</p>
                </div>
                <div class="text-right">
                    <p class="text-sm font-semibold text-purple-200">Riesgo: <span class="font-bold text-red-400">Medio</span></p>
                    <p class="text-sm font-semibold text-purple-200">Recompensa: <span class="font-bold text-green-400">Alto</span></p>
                </div>
            </div>
            <div class="rounded-xl border border-purple-800 p-4 bg-purple-800/30 shadow">
                <h4 class="font-semibold mb-2 text-beige-200">Justificación General</h4>
                <p class="text-sm leading-relaxed text-beige-100">El candidato cumple con los requisitos clave (atención telefónica, CRM, métricas) y muestra logros medibles. El inglés intermedio limita campañas bilingües, pero encaja muy bien en operaciones en español.</p>
            </div>
            <div class="grid md:grid-cols-2 gap-4">
                <div class="rounded-xl border border-purple-800 p-4 bg-green-900/20 shadow">
                    <h4 class="font-semibold mb-2 text-green-300">✅ Fortalezas</h4>
                    <ul class="list-disc pl-5 space-y-1 text-beige-100">
                        <li>4 años en atención al cliente telefónica y métricas sólidas (CSAT 95%).</li>
                        <li>Manejo de CRM (Salesforce, Zendesk) y experiencia en alto volumen de llamadas.</li>
                        <li>Reconocimientos formales y adherencia a calidad (QA).</li>
                    </ul>
                </div>
                <div class="rounded-xl border border-purple-800 p-4 bg-red-900/20 shadow">
                    <h4 class="font-semibold mb-2 text-red-300">❌ Debilidades</h4>
                    <ul class="list-disc pl-5 space-y-1 text-beige-100">
                        <li>Inglés intermedio, podría limitar campañas bilingües.</li>
                        <li>Experiencia principal en cuentas pospago móviles; curva de aprendizaje en otros rubros.</li>
                    </ul>
                </div>
            </div>
        </div>
      `;

      async function handleAnalyze() {
        if (!jobFile || !cvFile) {
            setError("Por favor, sube la Descripción del Puesto y el CV del Candidato.");
            return;
        }

        setLoading(true);
        setError(null);
        setResultHTML(null);

        try {
          let receivedHTML;

          if (mockMode) {
            await new Promise((r) => setTimeout(r, 1500));
            receivedHTML = mockHTMLResponse;
          } else {
            const form = new FormData();
            form.append("job_file", jobFile);
            form.append("cv_file", cvFile);

            const res = await fetch(WEBHOOK_URL, { method: "POST", body: form });
            if (!res.ok) throw new Error(`Error en la respuesta del servidor: ${res.status} ${res.statusText}`);

            receivedHTML = await res.text(); // Expecting HTML response
          }
          
          const newHistoryEntry = {
            html: receivedHTML,
            timestamp: new Date().toISOString(),
            jobFileName: jobFile.name,
            cvFileName: cvFile.name,
            // You might want to parse the rating from the HTML for display in history, or have n8n send it as a header
            calificacion: receivedHTML.match(/(\d+)\s*\/\s*10/)?.[1] || '-' 
          };

          setResultHTML(receivedHTML);
          setAnalysisHistory(prevHistory => [newHistoryEntry, ...prevHistory]);
          setJobFile(null);
          setCvFile(null);
        } catch (e) {
          console.error(e);
          setError(e.message || "Ocurrió un error inesperado al procesar el análisis.");
          setResultHTML(null); // Ensure we don't show a broken result screen
        } finally {
          setLoading(false);
        }
      }

      function handleClearHistory() {
        if (confirm("¿Estás seguro de que quieres borrar todo el historial de análisis?")) {
          setAnalysisHistory([]);
        }
      }

      function handleViewPastResult(result) {
        setResultHTML(result.html);
      }

      function FileInput({ id, label, accept, file, setFile }) {
        const handleFileChange = (e) => {
          setFile(e.target.files?.[0] || null);
        };
        return (
          <div className="space-y-2">
            <label htmlFor={id} className="block text-sm font-medium text-beige-200">{label}</label>
            <input
              type="file"
              id={id}
              accept={accept}
              onChange={handleFileChange}
              className="block w-full text-sm text-beige-100
                         file:mr-4 file:py-2 file:px-4
                         file:rounded-full file:border-0
                         file:text-sm file:font-semibold
                         file:bg-purple-700 file:text-white
                         hover:file:bg-purple-600 cursor-pointer"
            />
            {file && <p className="text-xs text-purple-300 mt-1">Archivo: <span className="font-medium">{file.name}</span></p>}
          </div>
        );
      }

      // --- Main View Component ---
      const MainView = () => (
        <main className="max-w-6xl mx-auto p-6 grid md:grid-cols-5 gap-6">
          {/* Left column: inputs */}
          <div className="md:col-span-2 space-y-5">
            <div className="rounded-xl shadow-lg p-5 border border-purple-700/50 bg-purple-900/50 backdrop-blur-sm">
                <h3 className="text-lg font-semibold mb-3 text-beige-200">1. Descripción del Puesto</h3>
                <FileInput id="jobFile" label="Selecciona el archivo" accept=".pdf,.doc,.docx,.txt,.rtf" file={jobFile} setFile={setJobFile} />
            </div>
            <div className="rounded-xl shadow-lg p-5 border border-purple-700/50 bg-purple-900/50 backdrop-blur-sm">
                <h3 className="text-lg font-semibold mb-3 text-beige-200">2. CV del Candidato</h3>
                <FileInput id="cvFile" label="Selecciona el archivo" accept=".pdf,.doc,.docx,.txt,.rtf" file={cvFile} setFile={setCvFile} />
            </div>
            <button
              onClick={handleAnalyze}
              disabled={loading || !jobFile || !cvFile}
              className="w-full rounded-xl bg-purple-600 text-white py-3 font-semibold hover:bg-purple-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 ease-in-out transform hover:scale-105 shadow-lg"
            >
              {loading ? "Analizando..." : "Analizar Candidato"}
            </button>
            {error && <p className="text-sm text-red-400 font-medium text-center mt-3">{error}</p>}
             {loading && (
                    <div className="flex flex-col items-center justify-center h-full text-center text-purple-300 mt-4">
                        <svg className="animate-spin -ml-1 mr-3 h-8 w-8 text-purple-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <p className="font-medium mt-4 text-beige-200">Procesando análisis...</p>
                    </div>
                )}
          </div>

          {/* Right column: History */}
          <div className="md:col-span-3 space-y-5">
              <div className="rounded-xl shadow-lg p-5 border border-purple-700/50 bg-purple-900/50 backdrop-blur-sm min-h-[400px]">
                  <h3 className="text-lg font-semibold mb-3 text-beige-200">Historial de Evaluaciones</h3>
                  {analysisHistory.length === 0 ? (
                      <div className="flex flex-col items-center justify-center h-full text-center text-purple-300 py-10">
                          <p className="text-beige-300">No hay evaluaciones previas.</p>
                      </div>
                  ) : (
                      <div className="space-y-3 max-h-[600px] overflow-y-auto pr-2">
                          {analysisHistory.map((analysis, index) => (
                              <div key={index} className="rounded-lg bg-purple-800/70 p-3 hover:bg-purple-700/80 cursor-pointer transition duration-200"
                                  onClick={() => handleViewPastResult(analysis)}>
                                  <p className="font-semibold text-white">{analysis.jobFileName} & {analysis.cvFileName}</p>
                                  <p className="text-xs text-purple-300">Evaluado: {new Date(analysis.timestamp).toLocaleString()}</p>
                                  <p className="text-sm text-beige-100">Calificación: <span className="font-bold">{analysis.calificacion} / 10</span></p>
                              </div>
                          ))}
                          <button
                              onClick={handleClearHistory}
                              className="mt-4 w-full rounded-md bg-red-700 py-2 text-sm font-semibold text-white hover:bg-red-600 transition duration-300"
                          >
                              Limpiar Historial
                          </button>
                      </div>
                  )}
              </div>
          </div>
        </main>
      );

      // --- Result View Component ---
      const ResultView = () => (
        <main className="max-w-4xl mx-auto p-6 animate-fade-in">
            <button
                onClick={() => setResultHTML(null)}
                className="flex items-center gap-2 rounded-full bg-purple-700 mb-6 px-4 py-2 text-sm font-semibold text-white hover:bg-purple-600 transition duration-300"
            >
                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path fillRule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clipRule="evenodd" />
                </svg>
                Volver
            </button>
            <div
              className="rounded-xl shadow-lg p-5 border border-purple-700/50 bg-purple-900/50 backdrop-blur-sm"
              dangerouslySetInnerHTML={{ __html: resultHTML }}
            />
        </main>
      );

      // --- UI Rendering ---
      return (
        <div className="min-h-screen">
          <header className="px-6 py-5 border-b border-purple-800 bg-purple-900/70 backdrop-blur-lg sticky top-0 z-10">
            <div className="max-w-6xl mx-auto flex items-center justify-between gap-4">
              <div>
                <h1 className="text-2xl font-bold text-white">Analyzers_CV <span className="font-light text-beige-200">by Automatia Studio</span></h1>
                <p className="text-purple-200 text-sm">Evaluación inteligente de candidaturas.</p>
              </div>
              <div className="flex items-center gap-3">
                <label className="inline-flex items-center cursor-pointer gap-2 text-sm font-medium text-purple-200">
                  <input type="checkbox" className="h-4 w-4 rounded text-purple-600 focus:ring-purple-500 bg-gray-700 border-gray-600" checked={mockMode} onChange={(e) => setMockMode(e.target.checked)} />
                  Modo Demo
                </label>
              </div>
            </div>
          </header>

          {resultHTML ? <ResultView /> : <MainView />}

          <footer className="text-center text-xs text-purple-300 py-6">
            © {new Date().getFullYear()} Analyzers_CV by Automatia Studio
          </footer>
        </div>
      );
    }

    // --- Mount React App to the DOM ---
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
