<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analyzers_CV by Automatia Studio</title>
  <!-- Tailwind CSS --><script src="https://cdn.tailwindcss.com"></script>
  <!-- React Libraries --><script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX transpilation --><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Custom font and minor style adjustments */
    body {
      font-family: 'Inter', sans-serif;
    }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    /* Custom scrollbar for aesthetic */
    ::-webkit-scrollbar {
        width: 8px;
    }
    ::-webkit-scrollbar-track {
        background: #1a0033; /* Dark purple for track */
    }
    ::-webkit-scrollbar-thumb {
        background: #6c4e97; /* Lighter purple for thumb */
        border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #8b6db4;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-purple-950 to-black text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Main Application Component ---
    function App() {
      // The n8n webhook URL (kept internally, not exposed to user)
      const WEBHOOK_URL = "https://invalvn8n.inversionesalvarado.website/webhook-test/analyzerscv";

      const [jobFile, setJobFile] = useState(null);
      const [cvFile, setCvFile] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [currentResult, setCurrentResult] = useState(null); // Result of the current analysis
      const [analysisHistory, setAnalysisHistory] = useState([]); // History of analyses
      const [mockMode, setMockMode] = useState(true); // Demo mode for quick UI testing
      const [viewingHistory, setViewingHistory] = useState(false); // State to toggle between current analysis and history

      // Load history from localStorage on component mount
      useEffect(() => {
        try {
          const storedHistory = localStorage.getItem("analysisHistory");
          if (storedHistory) {
            setAnalysisHistory(JSON.parse(storedHistory));
          }
        } catch (e) {
          console.error("Failed to load analysis history from localStorage", e);
        }
      }, []);

      // Save history to localStorage whenever it changes
      useEffect(() => {
        try {
          localStorage.setItem("analysisHistory", JSON.stringify(analysisHistory));
        } catch (e) {
          console.error("Failed to save analysis history to localStorage", e);
        }
      }, [analysisHistory]);

      // Example JSON contract your n8n webhook should return
      const mockResponse = {
        fortalezas: [
          "4 años en atención al cliente telefónica y métricas sólidas (CSAT 95%).",
          "Manejo de CRM (Salesforce, Zendesk) y experiencia en alto volumen de llamadas.",
          "Reconocimientos formales y adherencia a calidad (QA).",
        ],
        debilidades: [
          "Inglés intermedio, podría limitar campañas bilingües.",
          "Experiencia principal en cuentas pospago móviles; curva de aprendizaje en otros rubros.",
        ],
        factor_riesgo: { nivel: "Medio", detalle: "Posible rotación si no hay plan de crecimiento o si la campaña exige inglés avanzado." },
        factor_recompensa: {
          nivel: "Alto",
          detalle:
            "Podría elevar CSAT y FCR en campañas de soporte y fidelización; perfil estable para largo plazo si hay plan de carrera.",
          horizonte: "Largo plazo",
        },
        calificacion: 8,
        justificacion:
          "El candidato cumple con los requisitos clave (atención telefónica, CRM, métricas) y muestra logros medibles. El inglés intermedio limita campañas bilingües, pero encaja muy bien en operaciones en español.",
        sheet_points: [
          { key: "AHT", value: "~5:20 min" },
          { key: "FCR", value: "82%" },
          { key: "CSAT", value: "95%" },
          { key: "QA_Score", value: "92%" },
          { key: "Adherencia", value: "90%" },
        ],
        timestamp: new Date().toISOString(), // Add timestamp for history
        jobFileName: "Descripción de Puesto Ejemplo.pdf",
        cvFileName: "CV de Candidato Ejemplo.pdf"
      };

      async function handleAnalyze() {
        if (!jobFile || !cvFile) {
            setError("Por favor, sube la Descripción del Puesto y el CV del Candidato.");
            return;
        }

        setLoading(true);
        setError(null);
        setCurrentResult(null); // Clear previous current result

        try {
          let resultData;

          if (mockMode) {
            // Simulates the agent's response
            await new Promise((r) => setTimeout(r, 1500));
            resultData = {
              ...mockResponse,
              timestamp: new Date().toISOString(),
              jobFileName: jobFile.name,
              cvFileName: cvFile.name
            };
          } else {
            const form = new FormData();
            form.append("job_file", jobFile);
            form.append("cv_file", cvFile);

            const res = await fetch(WEBHOOK_URL, { method: "POST", body: form });
            if (!res.ok) throw new Error(`Error en la respuesta del servidor: ${res.status} ${res.statusText}`);

            resultData = await res.json();
            resultData = {
              ...resultData,
              timestamp: new Date().toISOString(),
              jobFileName: jobFile.name,
              cvFileName: cvFile.name
            };
          }
          
          setCurrentResult(resultData);
          setAnalysisHistory(prevHistory => [resultData, ...prevHistory]); // Add new result to history
          setViewingHistory(false); // Show current analysis result
          setJobFile(null); // Clear files after successful analysis
          setCvFile(null);
        } catch (e) {
          console.error(e);
          setError(e.message || "Ocurrió un error inesperado al procesar el análisis.");
        } finally {
          setLoading(false);
        }
      }

      function handleClearHistory() {
        if (confirm("¿Estás seguro de que quieres borrar todo el historial de análisis?")) {
          setAnalysisHistory([]);
          setCurrentResult(null); // Clear current result if it's based on history
        }
      }

      function handleViewPastResult(result) {
        setCurrentResult(result);
        setViewingHistory(false); // Switch to viewing current analysis (which is now the selected past result)
      }

      function SectionCard({ title, children, className = "" }) {
        return (
          <div className={`rounded-xl shadow-lg p-5 border border-purple-700/50 bg-purple-900/50 backdrop-blur-sm ${className}`}>
            <h3 className="text-lg font-semibold mb-3 text-beige-200">{title}</h3>
            <div className="text-sm text-beige-100 leading-relaxed">{children}</div>
          </div>
        );
      }

      function FileInput({ id, label, accept, file, setFile }) {
        const handleFileChange = (e) => {
          setFile(e.target.files?.[0] || null);
        };
        return (
          <div className="space-y-2">
            <label htmlFor={id} className="block text-sm font-medium text-beige-200">{label}</label>
            <input
              type="file"
              id={id}
              accept={accept}
              onChange={handleFileChange}
              className="block w-full text-sm text-beige-100
                         file:mr-4 file:py-2 file:px-4
                         file:rounded-full file:border-0
                         file:text-sm file:font-semibold
                         file:bg-purple-700 file:text-white
                         hover:file:bg-purple-600 cursor-pointer"
            />
            {file && <p className="text-xs text-purple-300 mt-1">Archivo seleccionado: <span className="font-medium">{file.name}</span></p>}
          </div>
        );
      }

      // --- UI Rendering ---
      return (
        <div className="min-h-screen">
          <header className="px-6 py-5 border-b border-purple-800 bg-purple-900/70 backdrop-blur-lg sticky top-0 z-10">
            <div className="max-w-6xl mx-auto flex items-center justify-between gap-4">
              <div>
                <h1 className="text-2xl font-bold text-white">Analyzers_CV <span className="font-light text-beige-200">by Automatia Studio</span></h1>
                <p className="text-purple-200 text-sm">Evaluación inteligente de candidaturas.</p>
              </div>
              <div className="flex items-center gap-3">
                <label className="inline-flex items-center cursor-pointer gap-2 text-sm font-medium text-purple-200">
                  <input type="checkbox" className="h-4 w-4 rounded text-purple-600 focus:ring-purple-500 bg-gray-700 border-gray-600" checked={mockMode} onChange={(e) => setMockMode(e.target.checked)} />
                  Modo Demo
                </label>
                <button
                    onClick={() => setViewingHistory(!viewingHistory)}
                    className="flex items-center gap-2 rounded-full bg-purple-700 px-4 py-2 text-sm font-semibold text-white hover:bg-purple-600 transition duration-300"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fillRule="evenodd" d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 0a2 2 0 100 4h2a2 2 0 100-4h-2z" clipRule="evenodd" />
                    </svg>
                    {viewingHistory ? "Nueva Evaluación" : "Ver Historial"}
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto p-6 grid md:grid-cols-5 gap-6">
            {/* Left column: inputs / History */}
            <div className="md:col-span-2 space-y-5">
              {viewingHistory ? (
                <SectionCard title="Historial de Evaluaciones">
                  {analysisHistory.length === 0 ? (
                    <p className="text-beige-300">No hay evaluaciones previas. ¡Empieza una nueva!</p>
                  ) : (
                    <div className="space-y-3 max-h-[600px] overflow-y-auto pr-2">
                      {analysisHistory.map((analysis, index) => (
                        <div key={index} className="rounded-lg bg-purple-800/70 p-3 hover:bg-purple-700/80 cursor-pointer transition duration-200"
                             onClick={() => handleViewPastResult(analysis)}>
                          <p className="font-semibold text-white">{analysis.jobFileName || "Descripción de Puesto"} & CV ({analysis.cvFileName || "Candidato"})</p>
                          <p className="text-xs text-purple-300">Evaluado el: {new Date(analysis.timestamp).toLocaleString()}</p>
                          <p className="text-sm text-beige-100">Calificación: <span className="font-bold">{analysis.calificacion || '-'} / 10</span></p>
                        </div>
                      ))}
                      <button
                        onClick={handleClearHistory}
                        className="mt-4 w-full rounded-md bg-red-700 py-2 text-sm font-semibold text-white hover:bg-red-600 transition duration-300"
                      >
                        Limpiar Historial
                      </button>
                    </div>
                  )}
                </SectionCard>
              ) : (
                <>
                  <SectionCard title="1. Subir Descripción del Puesto">
                    <FileInput
                      id="jobFile"
                      label="Selecciona un archivo PDF, DOCX, TXT o RTF"
                      accept=".pdf,.doc,.docx,.txt,.rtf"
                      file={jobFile}
                      setFile={setJobFile}
                    />
                  </SectionCard>

                  <SectionCard title="2. Subir CV del Candidato">
                    <FileInput
                      id="cvFile"
                      label="Selecciona un archivo PDF, DOCX, TXT o RTF"
                      accept=".pdf,.doc,.docx,.txt,.rtf"
                      file={cvFile}
                      setFile={setCvFile}
                    />
                  </SectionCard>

                  <button
                    onClick={handleAnalyze}
                    disabled={loading || !jobFile || !cvFile}
                    className="w-full rounded-xl bg-purple-600 text-white py-3 font-semibold hover:bg-purple-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 ease-in-out transform hover:scale-105 shadow-lg"
                  >
                    {loading ? "Analizando..." : "Analizar Candidato"}
                  </button>
                  {error && <p className="text-sm text-red-400 font-medium text-center mt-3">{error}</p>}
                </>
              )}
            </div>

            {/* Right column: results */}
            <div className="md:col-span-3 space-y-5">
              <SectionCard title="Resultado de la Evaluación" className="min-h-[500px]">
                {!currentResult && !loading && (
                  <div className="flex flex-col items-center justify-center h-full text-center text-purple-300">
                     <svg xmlns="http://www.w3.org/2000/svg" className="w-16 h-16 mb-4 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1}>
                        <path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                     </svg>
                    <p className="font-medium text-beige-200">Esperando datos</p>
                    <p className="text-xs max-w-sm">Sube los documentos y presiona "Analizar Candidato" para ver el informe aquí.</p>
                  </div>
                )}
                {loading && (
                    <div className="flex flex-col items-center justify-center h-full text-center text-purple-300">
                        <svg className="animate-spin -ml-1 mr-3 h-8 w-8 text-purple-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <p className="font-medium mt-4 text-beige-200">Procesando análisis...</p>
                        <p className="text-xs text-purple-300">Esto puede tardar unos segundos. Por favor, sé paciente.</p>
                    </div>
                )}
                {currentResult && (
                  <div className="space-y-6 animate-fade-in">
                    {/* Calificación */}
                    <div className="flex items-center justify-between p-4 bg-purple-800/70 rounded-xl shadow">
                      <div>
                        <p className="text-sm text-purple-300">Rating Global</p>
                        <p className="text-4xl font-bold text-beige-100">{currentResult.calificacion ?? "-"} / 10</p>
                        <p className="text-xs text-purple-400 mt-1">
                          Analizado el: {new Date(currentResult.timestamp).toLocaleString()}
                        </p>
                      </div>
                      <div className="text-right">
                        <p className="text-sm font-semibold text-purple-200">Riesgo: <span className="font-bold text-red-400">{currentResult?.factor_riesgo?.nivel ?? "-"}</span></p>
                        <p className="text-sm font-semibold text-purple-200">Recompensa: <span className="font-bold text-green-400">{currentResult?.factor_recompensa?.nivel ?? "-"}</span></p>
                      </div>
                    </div>

                    <div className="rounded-xl border border-purple-800 p-4 bg-purple-800/30 shadow">
                      <h4 className="font-semibold mb-2 text-beige-200">Justificación General</h4>
                      <p className="text-sm leading-relaxed text-beige-100">{currentResult.justificacion || "-"}</p>
                    </div>
                    
                    <div className="grid md:grid-cols-2 gap-4">
                      <div className="rounded-xl border border-purple-800 p-4 bg-green-900/20 shadow">
                        <h4 className="font-semibold mb-2 text-green-300">✅ Fortalezas</h4>
                        <ul className="list-disc pl-5 space-y-1 text-beige-100">
                          {(currentResult.fortalezas || []).map((f, i) => (
                            <li key={i}>{f}</li>
                          ))}
                        </ul>
                      </div>
                      <div className="rounded-xl border border-purple-800 p-4 bg-red-900/20 shadow">
                        <h4 className="font-semibold mb-2 text-red-300">❌ Debilidades</h4>
                        <ul className="list-disc pl-5 space-y-1 text-beige-100">
                          {(currentResult.debilidades || []).map((d, i) => (
                            <li key={i}>{d}</li>
                          ))}
                        </ul>
                      </div>
                    </div>

                    <div className="grid md:grid-cols-2 gap-4">
                      <div className="rounded-xl border border-purple-800 p-4 bg-purple-800/30 shadow">
                        <h4 className="font-semibold mb-1 text-beige-200">Detalle de Riesgo</h4>
                        <p className="text-sm text-beige-100">{currentResult?.factor_riesgo?.detalle || "-"}</p>
                      </div>
                      <div className="rounded-xl border border-purple-800 p-4 bg-purple-800/30 shadow">
                        <h4 className="font-semibold mb-1 text-beige-200">Factor de Recompensa</h4>
                        <p className="text-sm text-beige-100">{currentResult?.factor_recompensa?.detalle || "-"}</p>
                        <p className="text-xs text-purple-300 mt-1">Horizonte: {currentResult?.factor_recompensa?.horizonte || "-"}</p>
                      </div>
                    </div>
                    
                    {Array.isArray(currentResult.sheet_points) && currentResult.sheet_points.length > 0 && (
                      <div className="rounded-xl border border-purple-800 p-4 bg-purple-800/30 shadow">
                        <h4 className="font-semibold mb-2 text-beige-200">Métricas Clave Identificadas</h4>
                        <div className="grid md:grid-cols-3 gap-3">
                          {currentResult.sheet_points.map((p, i) => (
                            <div key={i} className="rounded-lg bg-purple-900/50 border border-purple-700 p-3 shadow-inner">
                              <p className="text-xs text-purple-300">{p.key}</p>
                              <p className="font-semibold text-beige-100">{p.value}</p>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </SectionCard>
            </div>
          </main>

          <footer className="text-center text-xs text-purple-300 py-6">
            © {new Date().getFullYear()} Analyzers_CV by Automatia Studio
          </footer>
        </div>
      );
    }

    // --- Mount React App to the DOM ---
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
